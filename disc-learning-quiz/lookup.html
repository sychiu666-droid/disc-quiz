<title>DISC × 學習風格 結果查詢</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #1a1a5e 0%, #3a2060 50%, #5a1040 100%);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 28px 16px 48px;
}
.outer { max-width: 520px; width: 100%; }

/* ── 頂部搜尋卡 ── */
.search-card {
  background: white; border-radius: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  padding: 28px 28px 22px;
  margin-bottom: 20px;
}
.top-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
.back-btn {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.82rem; font-weight: 800; color: #667eea;
  text-decoration: none; background: #eef2ff; border-radius: 20px;
  padding: 6px 14px; transition: background 0.15s;
}
.back-btn:hover { background: #e0e7ff; }
.search-title { font-size: 1.15rem; font-weight: 900; color: #1a202c; }
.search-sub { font-size: 0.82rem; color: #718096; margin-bottom: 14px; }
.input-row { display: flex; gap: 10px; }
.input-row input {
  flex: 1; padding: 13px 16px;
  border: 2px solid #e2e8f0; border-radius: 12px;
  font-size: 1.1rem; font-weight: 700; letter-spacing: 4px;
  color: #2d3748; font-family: 'Courier New', monospace;
  outline: none; transition: border-color 0.15s; text-transform: uppercase;
}
.input-row input:focus { border-color: #667eea; }
.btn-lookup {
  padding: 13px 20px;
  background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none;
  border-radius: 12px; font-size: 0.95rem; font-weight: 800; cursor: pointer;
  white-space: nowrap; font-family: inherit;
}
.btn-lookup:hover { opacity: 0.9; }
.status-msg { margin-top: 10px; font-size: 0.88rem; font-weight: 700; color: #718096; text-align: center; }
.status-msg.error { color: #e53e3e; }

/* ── 完整結果卡 ── */
.result-wrap { display: none; }
.result-wrap.visible { display: block; }
.result-card {
  background: white; border-radius: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
}
.result-header {
  padding: 36px 28px 28px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.combo-portrait-wrap { display: flex; justify-content: center; margin-bottom: 16px; }
.combo-portrait-img {
  width: 100%; max-width: 400px; height: auto; aspect-ratio: 654/434;
  border-radius: 16px; display: block; object-fit: cover;
  box-shadow: 0 12px 36px rgba(0,0,0,0.35), 0 0 0 4px rgba(255,255,255,0.5);
  cursor: zoom-in;
}
.combo-display { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
.disc-badge-wrap {
  width: 104px; height: 104px;
  background: rgba(255,255,255,0.2);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 28px rgba(0,0,0,0.22), 0 0 0 3px rgba(255,255,255,0.45);
  overflow: hidden; flex-shrink: 0;
}
.disc-result-photo { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; border-radius: 50%; }
.combo-times { font-size: 2.2rem; color: rgba(255,255,255,0.5); font-weight: 200; }
.style-badge-wrap {
  width: 84px; height: 84px;
  background: rgba(255,255,255,0.9);
  border-radius: 50%; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 28px rgba(0,0,0,0.22), 0 0 0 3px rgba(255,255,255,0.45);
  flex-shrink: 0; cursor: zoom-in;
}
.style-badge-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: center 33%; }
.zoomable { cursor: zoom-in; }
.lightbox-overlay {
  display: none; position: fixed; inset: 0; background: rgba(10,10,25,0.9);
  z-index: 9999; align-items: center; justify-content: center; padding: 32px 20px;
  cursor: zoom-out;
}
.lightbox-overlay.active { display: flex; }
.lightbox-frame { width: min(92vw, 520px); height: 82vh; display: flex; align-items: center; justify-content: center; }
.lightbox-frame img { width: 100%; height: 100%; object-fit: contain; border-radius: 16px; box-shadow: 0 20px 70px rgba(0,0,0,0.6); }
.lightbox-close {
  position: fixed; top: 18px; right: 22px; z-index: 10000;
  background: rgba(255,255,255,0.15); color: white; border: none;
  width: 40px; height: 40px; border-radius: 50%; font-size: 1.3rem;
  cursor: pointer; display: none; align-items: center; justify-content: center;
}
.lightbox-close.active { display: flex; }
.r-emoji { font-size: 2rem; margin-bottom: 4px; }
.r-combo-name { font-size: 2rem; font-weight: 900; color: white; margin-bottom: 8px; }
.r-type-labels { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.r-type-label { background: rgba(255,255,255,0.18); color: white; border-radius: 20px; padding: 5px 14px; font-size: 0.82rem; font-weight: 700; }

.result-body { padding: 24px 24px 28px; }
.section { margin-bottom: 22px; }
.section-title { font-size: 0.8rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #718096; margin-bottom: 12px; }
.combo-desc-box { background: #f8faff; border-radius: 16px; padding: 18px; font-size: 0.95rem; line-height: 1.7; color: #2d3748; border: 1.5px solid #e2e8f0; }
.disc-card { background: linear-gradient(135deg,#f8faff,#f0f4ff); border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 18px; }
.disc-card-inner { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.disc-card-mini-wrap { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: rgba(0,0,0,0.06); }
.disc-mini-photo { width: 56px; height: 56px; object-fit: cover; object-position: center 20%; border-radius: 50%; }
.disc-type-title { font-size: 1.05rem; font-weight: 900; color: #2d3748; }
.disc-type-sub { font-size: 0.8rem; color: #718096; font-weight: 700; }
.disc-type-desc { font-size: 0.88rem; line-height: 1.65; color: #4a5568; }
.style-card { background: #fffbeb; border: 1.5px solid #fde68a; border-radius: 16px; padding: 18px; }
.style-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.style-mini-wrap { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: rgba(0,0,0,0.06); cursor: zoom-in; }
.style-mini-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: center 33%; }
.style-role-title { font-size: 1rem; font-weight: 900; color: #92400e; }
.style-role-en { font-size: 0.8rem; color: #b45309; font-weight: 700; }
.style-role-desc { font-size: 0.88rem; line-height: 1.65; color: #78350f; }
.traits-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.trait-chip { display: flex; align-items: center; gap: 5px; background: #f0f4ff; border-radius: 20px; padding: 6px 12px; font-size: 0.82rem; color: #3730a3; font-weight: 700; }
.code-section { background: linear-gradient(135deg,#1a1a5e,#3a2060); border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 14px; }
.code-label { color: rgba(255,255,255,0.65); font-size: 0.78rem; font-weight: 800; margin-bottom: 4px; }
.code-value { font-family: 'Courier New', monospace; font-size: 1.5rem; font-weight: 900; color: white; letter-spacing: 5px; }
.code-info-rows { flex: 1; color: rgba(255,255,255,0.75); font-size: 0.82rem; font-weight: 700; display: flex; flex-direction: column; gap: 3px; }
</style>

<div class="outer">

  <!-- 搜尋卡 -->

<button class="lightbox-close" id="lightbox-close" onclick="closeLightbox()">✕</button>

<script>
function openLightbox(src) {
  if (!src) return;
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-overlay').classList.add('active');
  document.getElementById('lightbox-close').classList.add('active');
}
function closeLightbox() {
  document.getElementById('lightbox-overlay').classList.remove('active');
  document.getElementById('lightbox-close').classList.remove('active');
}

function lookup() {
  const code = document.getElementById('code-input').value.trim().toUpperCase();
  const statusEl = document.getElementById('status-msg');
  statusEl.style.display = 'none';
  statusEl.classList.remove('error');

  if (code.length < 6) {
    statusEl.textContent = '請輸入代碼（至少 6 碼）';
    statusEl.classList.add('error');
    statusEl.style.display = 'block';
    return;
  }

  document.getElementById('result-wrap').classList.remove('visible');
  statusEl.textContent = '查詢中…';
  statusEl.style.display = 'block';

  const cbName = '_lkCb' + Date.now();
  window[cbName] = function(data) {
    delete window[cbName];
    if (s.parentNode) s.parentNode.removeChild(s);
    statusEl.style.display = 'none';
    renderResult(data);
  };
  const s = document.createElement('script');
  s.src = APPS_SCRIPT_URL + '?code=' + encodeURIComponent(code) + '&quiz=learning&callback=' + cbName;
  s.onerror = function() {
    delete window[cbName];
    statusEl.textContent = '查詢失敗，請稍後再試。';
    statusEl.classList.add('error');
  };
  document.head.appendChild(s);
  setTimeout(function() {
    if (window[cbName]) { window[cbName]({ found: false }); }
  }, 10000);
}

function renderResult(data) {
  const statusEl = document.getElementById('status-msg');
  if (!data || !data.found) {
    statusEl.textContent = '找不到這組代碼，請確認是否輸入正確。';
    statusEl.classList.add('error');
    statusEl.style.display = 'block';
    return;
  }

  const disc  = DISC_ANIMALS[data.discType];
  const style = LEARNING_STYLES[data.styleType];
  const combo = COMBOS[data.discType + '-' + data.styleType];

  if (!disc || !style || !combo) {
    statusEl.textContent = '資料格式有誤，請聯絡老師。';
    statusEl.classList.add('error');
    statusEl.style.display = 'block';
    return;
  }

  const animalSrc = { D:'disc-d.webp', I:'disc-i.webp', S:'disc-s.webp', C:'disc-c.webp' };
  const styleSrc  = { V:'style-V.webp', A:'style-A.webp', K:'style-K.webp', R:'style-R.webp' };

  document.getElementById('r-header').style.background = disc.grad;
  document.getElementById('r-disc-img').src  = animalSrc[data.discType];
  document.getElementById('r-disc-mini').src = animalSrc[data.discType];
  document.getElementById('r-style-badge').innerHTML = `<img src="${styleSrc[data.styleType]}" alt="" onclick="openLightbox(this.src)">`;
  document.getElementById('r-style-mini').innerHTML  = `<img src="${styleSrc[data.styleType]}" alt="" onclick="openLightbox(this.src)">`;
  document.getElementById('r-combo-img').src = 'combo-images/' + data.discType + '-' + data.styleType + '.webp';

  document.getElementById('r-emoji').textContent      = combo.emoji;
  document.getElementById('r-combo-name').textContent = combo.name;
  document.getElementById('r-disc-label').textContent  = disc.emoji + ' ' + disc.badge;
  document.getElementById('r-style-label').textContent = style.emoji + ' ' + style.name;
  document.getElementById('r-combo-desc').textContent  = combo.desc;

  document.getElementById('r-disc-title').textContent = disc.emoji + ' ' + disc.name;
  document.getElementById('r-disc-sub').textContent   = disc.badge;
  document.getElementById('r-disc-desc').textContent  = disc.line + ' ' + disc.desc;

  document.getElementById('r-style-title').textContent = style.name;
  document.getElementById('r-style-en').textContent    = style.en + ' ｜ ' + style.badge;
  document.getElementById('r-style-desc').textContent  = style.desc;

  const tw = document.getElementById('r-traits');
  tw.innerHTML = '';
  disc.traits.forEach(tr => {
    const chip = document.createElement('span');
    chip.className = 'trait-chip';
    chip.textContent = tr.i + ' ' + tr.t;
    tw.appendChild(chip);
  });
  const sChip = document.createElement('span');
  sChip.className = 'trait-chip';
  sChip.style.cssText = 'background:#fffbeb;color:#c05621;border:1.5px solid #fde68a';
  sChip.textContent = style.emoji + ' ' + style.name;
  tw.appendChild(sChip);

  document.getElementById('r-code').textContent = data.code;
  document.getElementById('r-info').innerHTML =
    '<span>' + data.name + ' · ' + data.className + '</span>' +
    '<span>' + data.course + ' · ' + data.studentId + '</span>';

  document.getElementById('result-wrap').classList.add('visible');
  document.getElementById('result-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// 支援分享連結 ?code=XXXXXXXX 自動帶入並查詢
(function autoLookupFromUrl() {
  const params = new URLSearchParams(location.search);
  const code = (params.get('code') || '').trim().toUpperCase();
  if (code) {
    document.getElementById('code-input').value = code;
    lookup();
  }
})();
</script>
